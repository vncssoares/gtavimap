<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Mobile — GTAVIMap (Leonida Interactive)</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-pink: #ff2a85;
      --neon-cyan: #00e5ff;
      --neon-purple: #a855f7;
      --bg-dark: #08090e;
      --panel-bg: #12131c;
      --border-color: #232638;
      --phone-w: 393px;
      --phone-h: 852px;
      --scale: 0.95;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 42, 133, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 229, 255, 0.08) 0%, transparent 40%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Toolbar */
    .top-bar {
      background: rgba(18, 19, 28, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple), var(--neon-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: #000;
      box-shadow: 0 0 20px rgba(255, 42, 133, 0.35);
    }

    .brand-text h1 {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-text span.pink { color: var(--neon-pink); }
    .brand-text p {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--neon-cyan);
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      background: #181a26;
      border: 1px solid var(--border-color);
      color: #cbd5e1;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:hover {
      border-color: var(--neon-pink);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn.active {
      background: linear-gradient(135deg, rgba(255, 42, 133, 0.2), rgba(0, 229, 255, 0.2));
      border-color: var(--neon-cyan);
      color: #fff;
    }

    .btn-glow {
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan));
      color: #000;
      font-weight: 800;
      border: none;
    }

    .btn-glow:hover {
      box-shadow: 0 0 16px rgba(255, 42, 133, 0.5);
      color: #000;
      transform: translateY(-1px);
    }

    /* URL / Routes Bar */
    .url-bar-container {
      background: rgba(14, 15, 22, 0.9);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .url-input-box {
      flex: 1;
      min-width: 280px;
      display: flex;
      align-items: center;
      background: #090a0f;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 8px;
      gap: 8px;
    }

    .url-input-box span.lock {
      color: #10b981;
      font-size: 12px;
    }

    .url-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .quick-links {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag-link {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      background: #161824;
      border: 1px solid var(--border-color);
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tag-link:hover, .tag-link.active {
      color: #fff;
      border-color: var(--neon-pink);
      background: rgba(255, 42, 133, 0.15);
    }

    /* Main Simulator Stage */
    .simulator-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
    }

    /* Smartphone Frame */
    .phone-wrapper {
      transform: scale(var(--scale));
      transform-origin: center center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .phone {
      width: var(--phone-w);
      height: var(--phone-h);
      background: #1c1d24;
      border-radius: 56px;
      padding: 12px;
      position: relative;
      box-shadow: 
        0 0 0 3px #323548,
        0 0 0 6px #15161e,
        0 25px 60px -10px rgba(0, 0, 0, 0.8),
        0 0 80px rgba(255, 42, 133, 0.15);
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Hardware Buttons */
    .phone::before {
      /* Volume buttons */
      content: '';
      position: absolute;
      left: -9px;
      top: 140px;
      width: 5px;
      height: 48px;
      background: #323548;
      border-radius: 3px 0 0 3px;
      box-shadow: 0 60px 0 #323548, 0 -35px 0 #323548;
    }

    .phone::after {
      /* Power button */
      content: '';
      position: absolute;
      right: -9px;
      top: 170px;
      width: 5px;
      height: 72px;
      background: #323548;
      border-radius: 0 3px 3px 0;
    }

    /* Phone Screen */
    .screen {
      flex: 1;
      background: #000;
      border-radius: 46px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.1);
    }

    /* Status Bar */
    .status-bar {
      height: 46px;
      background: #0e0f15;
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      z-index: 20;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: width 0.3s ease;
    }

    .camera-lens {
      width: 11px;
      height: 11px;
      background: #111;
      border-radius: 50%;
      box-shadow: inset 0 0 2px #00e5ff;
    }

    .sensor {
      width: 8px;
      height: 8px;
      background: #181818;
      border-radius: 50%;
    }

    /* Iframe */
    .iframe-container {
      flex: 1;
      position: relative;
      width: 100%;
      background: #0e0f15;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0e0f15;
    }

    /* Home Indicator bar */
    .home-indicator-bar {
      height: 22px;
      background: #0e0f15;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .home-indicator {
      width: 134px;
      height: 4px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 10px;
    }

    /* Landscape Mode */
    .phone.landscape {
      width: var(--phone-h);
      height: var(--phone-w);
      border-radius: 56px;
    }

    .phone.landscape::before {
      top: -9px;
      left: 170px;
      width: 72px;
      height: 5px;
      box-shadow: none;
      border-radius: 3px 3px 0 0;
    }

    .phone.landscape::after {
      bottom: -9px;
      right: 170px;
      top: auto;
      width: 72px;
      height: 5px;
      border-radius: 0 0 3px 3px;
    }

    .phone.landscape .dynamic-island {
      top: 50%;
      left: 16px;
      transform: translateY(-50%) rotate(90deg);
    }

    .phone.landscape .status-bar {
      display: none;
    }

    .phone.landscape .home-indicator-bar {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      border: none;
    }

    /* Bottom Info Footer */
    .footer-bar {
      background: #0d0e15;
      border-top: 1px solid var(--border-color);
      padding: 10px 24px;
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-bar a {
      color: var(--neon-cyan);
      text-decoration: none;
    }

    .footer-bar a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Top Toolbar -->
  <header class="top-bar">
    <div class="brand">
      <div class="brand-logo">VI</div>
      <div class="brand-text">
        <h1>GTA<span class="pink">VI</span>Map Mobile Simulator</h1>
        <p>Leonida Interactive Viewport</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <!-- Device Model Selector -->
      <button class="btn active" id="btn-iphone15" onclick="setDevice('iphone15')">
        📱 iPhone 15 Pro
      </button>
      <button class="btn" id="btn-galaxy" onclick="setDevice('galaxy')">
        📱 Galaxy S24
      </button>
      <button class="btn" id="btn-iphonese" onclick="setDevice('iphonese')">
        📱 iPhone SE
      </button>
      <button class="btn" id="btn-tablet" onclick="setDevice('tablet')">
        📟 iPad Mini
      </button>

      <!-- Orientation Toggle -->
      <button class="btn" id="btn-orientation" onclick="toggleOrientation()">
        🔄 Girar (Paisagem)
      </button>

      <!-- Zoom / Scale Controls -->
      <button class="btn" onclick="adjustScale(-0.1)">🔍 -</button>
      <span id="scale-indicator" style="font-size: 11px; font-family: 'JetBrains Mono', monospace; color: #94a3b8;">95%</span>
      <button class="btn" onclick="adjustScale(0.1)">🔍 +</button>

      <!-- Refresh / Open Tab -->
      <button class="btn" onclick="reloadFrame()">🔄 Recarregar</button>
      <button class="btn btn-glow" onclick="openOriginalTab()">↗ Abrir no Navegador</button>
    </div>
  </header>

  <!-- URL Bar & Shortcuts -->
  <div class="url-bar-container">
    <div class="url-input-box">
      <span class="lock">🔒</span>
      <input type="text" id="target-url" class="url-input" value="http://localhost:3000/pt-br">
      <button class="btn" style="padding: 4px 10px; font-size: 11px;" onclick="navigateUrl()">Ir</button>
    </div>

    <!-- Quick Shortcuts -->
    <div class="quick-links">
      <span style="font-size: 11px; color: #64748b; font-weight: 700;">Atalhos:</span>
      <button class="tag-link active" onclick="loadRoute('/pt-br')">🇧🇷 Início</button>
      <button class="tag-link" onclick="loadRoute('/en')">🇺🇸 Início (EN)</button>
      <button class="tag-link" onclick="loadRoute('/es')">🇪🇸 Início (ES)</button>
      <button class="tag-link" onclick="loadRoute('/pt-br/map')">🗺️ Mapa Interativo</button>
      <button class="tag-link" onclick="loadRoute('/pt-br/categories')">📑 Categorias</button>
      <button class="tag-link" onclick="loadRoute('/pt-br/premium')">⭐ Premium</button>
    </div>
  </div>

  <!-- Stage with Smartphone -->
  <main class="simulator-stage">
    <div class="phone-wrapper" id="phone-wrapper">
      <div class="phone" id="phone-chassis">
        <div class="screen">
          
          <!-- Dynamic Island -->
          <div class="dynamic-island">
            <div class="sensor"></div>
            <div class="camera-lens"></div>
          </div>

          <!-- Status Bar -->
          <div class="status-bar">
            <span id="clock-display">16:20</span>
            <div class="status-icons">
              <span>5G</span>
              <span>📶</span>
              <span>🔋 100%</span>
            </div>
          </div>

          <!-- Iframe Container -->
          <div class="iframe-container">
            <iframe id="mobile-iframe" src="http://localhost:3000/pt-br" title="GTAVIMap Mobile View"></iframe>
          </div>

          <!-- Home Indicator -->
          <div class="home-indicator-bar">
            <div class="home-indicator"></div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer Info -->
  <footer class="footer-bar">
    <div>
      <span>Simulador responsivo em tempo real • Rodando localmente em <strong>http://localhost:3000</strong></span>
    </div>
    <div>
      <span>Dica: Use <strong>F12</strong> no navegador para inspecionar ou simular toques de tela (touch emulation).</span>
    </div>
  </footer>

  <script>
    const iframe = document.getElementById('mobile-iframe');
    const urlInput = document.getElementById('target-url');
    const phoneWrapper = document.getElementById('phone-wrapper');
    const phoneChassis = document.getElementById('phone-chassis');
    const scaleIndicator = document.getElementById('scale-indicator');
    const btnOrientation = document.getElementById('btn-orientation');
    const clockDisplay = document.getElementById('clock-display');

    let currentScale = 0.95;
    let isLandscape = false;
    let currentDevice = 'iphone15';

    const DEVICES = {
      iphone15: { w: '393px', h: '852px', radius: '56px', name: 'iPhone 15 Pro' },
      galaxy: { w: '412px', h: '915px', radius: '48px', name: 'Samsung Galaxy S24' },
      iphonese: { w: '375px', h: '667px', radius: '40px', name: 'iPhone SE' },
      tablet: { w: '768px', h: '1024px', radius: '36px', name: 'iPad Mini' }
    };

    // Atualiza relógio do status bar
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      clockDisplay.textContent = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 10000);

    // Navega para a URL digitada
    function navigateUrl() {
      let target = urlInput.value.trim();
      if (!target.startsWith('http://') && !target.startsWith('https://')) {
        target = 'http://' + target;
      }
      iframe.src = target;
      urlInput.value = target;
    }

    // Carrega rota rápida
    function loadRoute(path) {
      const baseUrl = 'http://localhost:3000';
      const fullUrl = baseUrl + path;
      urlInput.value = fullUrl;
      iframe.src = fullUrl;

      document.querySelectorAll('.tag-link').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    // Recarrega o iframe
    function reloadFrame() {
      iframe.src = iframe.src;
    }

    // Abre a URL em uma nova aba
    function openOriginalTab() {
      window.open(urlInput.value, '_blank');
    }

    // Altera o modelo de celular
    function setDevice(deviceKey) {
      currentDevice = deviceKey;
      const dev = DEVICES[deviceKey];

      document.querySelectorAll('.controls .btn').forEach(b => {
        if (b.id && b.id.startsWith('btn-') && b.id !== 'btn-orientation') {
          b.classList.remove('active');
        }
      });
      const activeBtn = document.getElementById(`btn-${deviceKey}`);
      if (activeBtn) activeBtn.classList.add('active');

      document.documentElement.style.setProperty('--phone-w', dev.w);
      document.documentElement.style.setProperty('--phone-h', dev.h);

      if (deviceKey === 'tablet') {
        currentScale = 0.75;
        applyScale();
      } else if (currentScale < 0.85) {
        currentScale = 0.95;
        applyScale();
      }
    }

    // Alterna rotação (retrato / paisagem)
    function toggleOrientation() {
      isLandscape = !isLandscape;
      phoneChassis.classList.toggle('landscape', isLandscape);
      btnOrientation.classList.toggle('active', isLandscape);
      btnOrientation.textContent = isLandscape ? '📱 Girar (Retrato)' : '🔄 Girar (Paisagem)';

      if (isLandscape && currentScale > 0.8) {
        currentScale = 0.8;
        applyScale();
      }
    }

    // Ajusta zoom da simulação
    function adjustScale(delta) {
      currentScale = Math.min(1.4, Math.max(0.4, currentScale + delta));
      applyScale();
    }

    function applyScale() {
      document.documentElement.style.setProperty('--scale', currentScale);
      scaleIndicator.textContent = Math.round(currentScale * 100) + '%';
    }

    // Sincroniza a barra de endereço quando o usuário navega dentro do iframe
    iframe.addEventListener('load', () => {
      try {
        const frameUrl = iframe.contentWindow.location.href;
        if (frameUrl && frameUrl !== 'about:blank') {
          urlInput.value = frameUrl;
        }
      } catch (e) {
        // Cross-origin se mudar para domínio externo
      }
    });
  </script>
</body>
</html>
