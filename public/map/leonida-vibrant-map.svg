<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="2000" height="2000" style="background:#3b9cb0;">
  <defs>
    <!-- Gradiente do Oceano Turquesa Vibrante (Estilo GTA VI / Vice City) -->
    <radialGradient id="vibrantOcean" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#4aaebf" />
      <stop offset="60%" stop-color="#3b9cb0" />
      <stop offset="100%" stop-color="#2d7e90" />
    </radialGradient>

    <!-- Terreno Principal (Verde Pastel Tropical com Praias de Areia) -->
    <linearGradient id="mainlandTerrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c99a" />
      <stop offset="50%" stop-color="#80bd88" />
      <stop offset="100%" stop-color="#6ea976" />
    </linearGradient>

    <!-- Terreno Urbano / Vice City -->
    <linearGradient id="urbanTerrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a4b8ab" />
      <stop offset="100%" stop-color="#8fa396" />
    </linearGradient>

    <!-- Pântano de Grassrivers -->
    <linearGradient id="swampTerrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d9972" />
      <stop offset="100%" stop-color="#557c5a" />
    </linearGradient>

    <!-- Faixas de Areia / Praias Douradas -->
    <filter id="sandGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ecd99f" flood-opacity="0.8" />
    </filter>

    <pattern id="lightGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#5bbcd0" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    </pattern>
  </defs>

  <!-- Oceano de Fundo -->
  <rect width="1000" height="1000" fill="url(#vibrantOcean)" />
  <rect width="1000" height="1000" fill="url(#lightGrid)" />

  <!-- Corais e Águas Rasas ao redor da Costa (Tons Turquesa Claro) -->
  <path d="
    M 70,930
    C 100,770 140,710 170,660
    C 200,610 270,610 320,600
    C 380,590 430,620 480,580
    C 520,540 560,500 540,430
    C 520,380 460,360 450,320
    C 440,280 470,240 500,220
    C 510,180 470,140 430,130
    C 380,120 330,150 290,140
    C 240,130 220,90 180,100
    C 140,110 120,160 100,220
    C 80,280 60,350 90,410
    C 110,450 150,470 140,530
    C 130,590 90,630 70,690
    C 50,750 50,850 70,930 Z
  " fill="#58bad0" opacity="0.6" filter="blur(6px)" />

  <path d="
    M 690,700
    C 730,710 790,690 820,630
    C 840,570 840,470 830,380
    C 820,300 790,250 760,260
    C 730,270 720,320 730,410
    C 740,500 730,590 710,650
    C 700,670 690,690 690,700 Z
  " fill="#58bad0" opacity="0.6" filter="blur(6px)" />

  <!-- ================= CONTINENTE PRINCIPAL DE LEONIDA ================= -->
  <!-- Borda de Praia (Areia Dourada) -->
  <path d="
    M 90,910
    C 115,775 145,715 175,675
    C 205,635 275,625 325,615
    C 375,605 415,625 455,595
    C 495,565 535,515 515,445
    C 495,395 435,375 425,335
    C 415,295 445,255 475,235
    C 485,195 455,155 415,145
    C 375,135 325,165 295,155
    C 255,145 235,105 195,115
    C 155,125 135,175 115,235
    C 95,295 75,355 105,415
    C 125,455 165,475 155,535
    C 145,595 105,635 85,695
    C 65,755 75,835 90,910 Z
  " fill="#ecd99f" stroke="#d5be7d" stroke-width="4" />

  <!-- Terreno Verde Principal -->
  <path d="
    M 94,904
    C 118,772 147,713 176,673
    C 205,633 274,623 323,613
    C 372,603 412,623 451,593
    C 491,563 530,513 511,444
    C 492,395 434,375 424,336
    C 414,297 443,258 472,238
    C 482,199 453,160 414,150
    C 375,140 326,169 297,160
    C 258,150 239,112 200,121
    C 161,130 142,179 122,237
    C 103,296 84,354 113,413
    C 132,452 171,471 161,530
    C 151,589 113,628 93,687
    C 74,746 83,825 94,904 Z
  " fill="url(#mainlandTerrain)" />

  <!-- Pântanos de Grassrivers (Everglades) -->
  <path d="
    M 330,320
    C 350,280 390,260 420,270
    C 450,280 470,250 490,220
    C 500,180 470,150 430,160
    C 380,170 340,210 320,240
    C 300,270 310,300 330,320 Z
  " fill="url(#swampTerrain)" stroke="#4d7252" stroke-width="2" />

  <!-- Ilhas dos Pântanos -->
  <circle cx="370" cy="230" r="14" fill="#628b66" stroke="#486a4c" />
  <circle cx="410" cy="200" r="9" fill="#628b66" stroke="#486a4c" />
  <circle cx="440" cy="240" r="12" fill="#628b66" stroke="#486a4c" />
  <circle cx="340" cy="200" r="8" fill="#628b66" stroke="#486a4c" />

  <!-- Lago Leonida (Interior) -->
  <path d="
    M 280,750
    C 320,770 360,740 370,700
    C 380,660 350,640 310,650
    C 270,660 250,710 280,750 Z
  " fill="#3b9cb0" stroke="#85b98a" stroke-width="3" />

  <!-- ================= BAÍA DE VICE CITY E ILHAS ================= -->
  <!-- Starfish Island (Ilha dos Mansões) com borda de areia -->
  <path d="
    M 598,642
    C 619,662 651,652 662,631
    C 672,610 651,588 630,588
    C 609,588 588,610 598,642 Z
  " fill="#ecd99f" stroke="#d5be7d" stroke-width="2" />
  <path d="
    M 601,640
    C 620,660 650,650 660,630
    C 670,610 650,590 630,590
    C 610,590 590,610 601,640 Z
  " fill="#80bd88" />

  <!-- Venetian Causeway Islands -->
  <ellipse cx="610" cy="550" rx="22" ry="11" fill="#ecd99f" stroke="#d5be7d" stroke-width="1.5" />
  <ellipse cx="610" cy="550" rx="20" ry="9" fill="#80bd88" />
  <ellipse cx="660" cy="550" rx="20" ry="10" fill="#ecd99f" stroke="#d5be7d" stroke-width="1.5" />
  <ellipse cx="660" cy="550" rx="18" ry="8" fill="#80bd88" />

  <!-- ================= PENÍNSULA DE VICE BEACH ================= -->
  <!-- Borda de Areia Dourada Longa de Vice Beach -->
  <path d="
    M 708,683
    C 739,694 781,673 802,621
    C 823,569 823,478 812,397
    C 802,316 781,266 749,276
    C 718,287 708,338 718,419
    C 728,499 718,580 697,642
    C 687,662 698,678 708,683 Z
  " fill="#ecd99f" stroke="#d5be7d" stroke-width="4" />

  <!-- Terreno da Península -->
  <path d="
    M 710,680
    C 740,690 780,670 800,620
    C 820,570 820,480 810,400
    C 800,320 780,270 750,280
    C 720,290 710,340 720,420
    C 730,500 720,580 700,640
    C 690,660 700,675 710,680 Z
  " fill="url(#urbanTerrain)" />

  <!-- ================= THE VICE KEYS ================= -->
  <ellipse cx="680" cy="180" rx="37" ry="17" fill="#ecd99f" stroke="#d5be7d" stroke-width="2" transform="rotate(-15 680 180)" />
  <ellipse cx="680" cy="180" rx="34" ry="14" fill="#80bd88" transform="rotate(-15 680 180)" />

  <ellipse cx="740" cy="150" rx="30" ry="14" fill="#ecd99f" stroke="#d5be7d" stroke-width="2" transform="rotate(-20 740 150)" />
  <ellipse cx="740" cy="150" rx="27" ry="11" fill="#80bd88" transform="rotate(-20 740 150)" />

  <ellipse cx="790" cy="120" rx="24" ry="12" fill="#ecd99f" stroke="#d5be7d" stroke-width="2" transform="rotate(-25 790 120)" />
  <ellipse cx="790" cy="120" rx="21" ry="9" fill="#80bd88" transform="rotate(-25 790 120)" />

  <ellipse cx="830" cy="90" rx="20" ry="10" fill="#ecd99f" stroke="#d5be7d" stroke-width="2" transform="rotate(-30 830 90)" />
  <ellipse cx="830" cy="90" rx="17" ry="7" fill="#80bd88" transform="rotate(-30 830 90)" />

  <!-- ================= RODOVIAS BRANCAS ESTILO GTA VI ================= -->
  <!-- Linhas de Rodovias em Branco com Contorno Sutil Cinza (Como na imagem do usuário!) -->
  <path d="M 830,90 L 790,120 L 740,150 L 680,180 Q 640,220 620,300 L 620,450" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <path d="M 830,90 L 790,120 L 740,150 L 680,180 Q 640,220 620,300 L 620,450" fill="none" stroke="#c0d4df" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Pontes de Conexão Downtown -> Vice Beach -->
  <line x1="530" y1="580" x2="610" y2="550" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <line x1="610" y1="550" x2="660" y2="550" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <line x1="660" y1="550" x2="730" y2="550" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <line x1="520" y1="460" x2="730" y2="460" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- Rodovia Principal da Costa Oeste e Norte (Mainland Highway) -->
  <path d="M 200,880 Q 250,700 280,550 T 350,380 T 430,220" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 200,880 Q 250,700 280,550 T 350,380 T 430,220" fill="none" stroke="#dce5eb" stroke-width="2" stroke-linecap="round" />

  <!-- Malha de Vias Metropolitanas de Vice City -->
  <path d="M 450,620 Q 560,650 560,520 T 480,440 Z" fill="none" stroke="#ffffff" stroke-width="3" />
  <path d="M 470,580 L 550,580" stroke="#ffffff" stroke-width="2.5" />
  <path d="M 490,520 L 540,520" stroke="#ffffff" stroke-width="2.5" />
  <path d="M 520,620 L 520,460" stroke="#ffffff" stroke-width="2.5" />

  <!-- Avenidas Costeiras de Vice Beach -->
  <path d="M 725,650 L 740,550 L 735,420 L 740,300" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <path d="M 780,630 L 795,530 L 790,400 L 775,300" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Aeroporto Internacional -->
  <g transform="translate(560, 360)">
    <rect x="-35" y="-35" width="70" height="70" fill="#9db0a2" rx="4" />
    <line x1="-30" y1="-20" x2="30" y2="20" stroke="#ffffff" stroke-width="3.5" />
    <line x1="-30" y1="20" x2="30" y2="-20" stroke="#ffffff" stroke-width="3.5" />
  </g>
</svg>
