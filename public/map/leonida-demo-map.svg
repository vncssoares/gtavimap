<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="2000" height="2000" style="background:#070b12;">
  <defs>
    <!-- Gradientes de Terreno e Água -->
    <radialGradient id="oceanGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="60%" stop-color="#080e18" />
      <stop offset="100%" stop-color="#04070c" />
    </radialGradient>

    <linearGradient id="mainlandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d28" />
      <stop offset="50%" stop-color="#182330" />
      <stop offset="100%" stop-color="#1b2938" />
    </linearGradient>

    <linearGradient id="beachGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#243447" />
      <stop offset="85%" stop-color="#2d425b" />
      <stop offset="100%" stop-color="#3b5677" />
    </linearGradient>

    <linearGradient id="wetlandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11221f" />
      <stop offset="100%" stop-color="#0e1a18" />
    </linearGradient>

    <pattern id="cartoGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#172433" stroke-width="0.7" stroke-dasharray="2 4"/>
      <circle cx="0" cy="0" r="1.5" fill="#223952" />
    </pattern>

    <pattern id="militarySubGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#15202d" />
    </pattern>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Oceânico Profundo -->
  <rect width="1000" height="1000" fill="url(#oceanGlow)" />

  <!-- Linhas Batimétricas Submarinas -->
  <path d="M 50,950 Q 300,850 500,920 T 950,880" fill="none" stroke="#0e1926" stroke-width="2" />
  <path d="M 0,500 Q 250,420 500,480 T 1000,430" fill="none" stroke="#0e1926" stroke-width="1.5" />
  <path d="M 100,100 Q 400,180 700,90 T 980,120" fill="none" stroke="#0e1926" stroke-width="1.5" />

  <!-- Grade Cartográfica de Coordenadas -->
  <rect width="1000" height="1000" fill="url(#cartoGrid)" />
  <rect width="1000" height="1000" fill="url(#militarySubGrid)" />

  <!-- ================= CONTINENTE PRINCIPAL DE LEONIDA ================= -->
  <!-- Grande massa de terra ao norte e centro-oeste -->
  <path d="
    M 100,900
    C 120,780 150,720 180,680
    C 210,640 280,630 330,620
    C 380,610 420,630 460,600
    C 500,570 540,520 520,450
    C 500,400 440,380 430,340
    C 420,300 450,260 480,240
    C 490,200 460,160 420,150
    C 380,140 330,170 300,160
    C 260,150 240,110 200,120
    C 160,130 140,180 120,240
    C 100,300 80,360 110,420
    C 130,460 170,480 160,540
    C 150,600 110,640 90,700
    C 70,760 80,840 100,900 Z
  " fill="url(#mainlandGrad)" stroke="#26394e" stroke-width="2.5" />

  <!-- Pântanos de Grassrivers (Everglades) - Massa Úmida Sul-Centro -->
  <path d="
    M 330,320
    C 350,280 390,260 420,270
    C 450,280 470,250 490,220
    C 500,180 470,150 430,160
    C 380,170 340,210 320,240
    C 300,270 310,300 330,320 Z
  " fill="url(#wetlandGrad)" stroke="#1a3b34" stroke-width="1.8" stroke-dasharray="5 2" />

  <!-- Ilhotas e canais dos pântanos -->
  <circle cx="370" cy="230" r="14" fill="#142823" stroke="#22483d" />
  <circle cx="410" cy="200" r="9" fill="#142823" stroke="#22483d" />
  <circle cx="440" cy="240" r="12" fill="#142823" stroke="#22483d" />
  <circle cx="340" cy="200" r="8" fill="#142823" stroke="#22483d" />

  <!-- Lago Leonida (Interior) -->
  <path d="
    M 280,750
    C 320,770 360,740 370,700
    C 380,660 350,640 310,650
    C 270,660 250,710 280,750 Z
  " fill="#09111c" stroke="#1d2f42" stroke-width="2" />
  <text x="320" y="700" fill="#2d4560" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="2">LAKE LEONIDA</text>

  <!-- ================= BAÍA DE VICE CITY E ILHAS ================= -->
  <!-- Starfish Island (Ilha dos Mansões) -->
  <path d="
    M 600,640
    C 620,660 650,650 660,630
    C 670,610 650,590 630,590
    C 610,590 590,610 600,640 Z
  " fill="#202e3f" stroke="#334b66" stroke-width="1.5" />
  <text x="630" y="625" fill="#3b5675" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">STARFISH ISLE</text>

  <!-- Venetian Causeway Islands -->
  <ellipse cx="610" cy="550" rx="20" ry="10" fill="#1d2b3a" stroke="#2d4259" />
  <ellipse cx="660" cy="550" rx="18" ry="9" fill="#1d2b3a" stroke="#2d4259" />

  <!-- ================= PENÍNSULA DE VICE BEACH ================= -->
  <!-- Longa faixa de praia e art deco à leste -->
  <path d="
    M 710,680
    C 740,690 780,670 800,620
    C 820,570 820,480 810,400
    C 800,320 780,270 750,280
    C 720,290 710,340 720,420
    C 730,500 720,580 700,640
    C 690,660 700,675 710,680 Z
  " fill="url(#beachGrad)" stroke="#3d5775" stroke-width="2.5" />

  <!-- Destaque de Praia de Areia / Orla -->
  <path d="
    M 795,620
    C 815,570 815,480 805,400
    C 795,330 780,285 755,282
  " fill="none" stroke="#d4b483" stroke-width="2" opacity="0.4" />

  <!-- ================= THE VICE KEYS ================= -->
  <!-- Cadeia de Ilhas ao Sul -->
  <ellipse cx="680" cy="180" rx="35" ry="15" fill="#1b2a3a" stroke="#2c425a" transform="rotate(-15 680 180)" />
  <ellipse cx="740" cy="150" rx="28" ry="12" fill="#1b2a3a" stroke="#2c425a" transform="rotate(-20 740 150)" />
  <ellipse cx="790" cy="120" rx="22" ry="10" fill="#1b2a3a" stroke="#2c425a" transform="rotate(-25 790 120)" />
  <ellipse cx="830" cy="90" rx="18" ry="8" fill="#1b2a3a" stroke="#2c425a" transform="rotate(-30 830 90)" />

  <!-- ================= RODOVIAS PRINCIPAIS ================= -->
  <!-- Overseas Highway (Keys até Vice City) -->
  <path d="M 830,90 L 790,120 L 740,150 L 680,180 Q 640,220 620,300 L 620,450" fill="none" stroke="#00ff66" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.75" />

  <!-- Pontes de Conexão Downtown -> Vice Beach -->
  <line x1="530" y1="580" x2="610" y2="550" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
  <line x1="610" y1="550" x2="660" y2="550" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
  <line x1="660" y1="550" x2="730" y2="550" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
  <line x1="520" y1="460" x2="730" y2="460" stroke="#38bdf8" stroke-width="2" opacity="0.8" />

  <!-- Rodovia Interestadual Norte-Sul (Mainland Highway) -->
  <path d="M 200,880 Q 250,700 280,550 T 350,380 T 430,220" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.75" />

  <!-- Anel Viário Metropolitano -->
  <path d="M 450,620 Q 560,650 560,520 T 480,440 Z" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" />

  <!-- Aeroporto Internacional (Pistas de Pouso em X) -->
  <g transform="translate(560, 360)">
    <rect x="-35" y="-35" width="70" height="70" fill="#131e2b" stroke="#24364b" stroke-width="1" />
    <line x1="-30" y1="-20" x2="30" y2="20" stroke="#64748b" stroke-width="3" />
    <line x1="-30" y1="20" x2="30" y2="-20" stroke="#64748b" stroke-width="3" />
    <text x="0" y="30" fill="#475569" font-family="monospace" font-size="6" text-anchor="middle">VICE CITY INT. AIRPORT</text>
  </g>

  <!-- ================= TOPONÍMIA E NOMES REGIONAIS ================= -->
  <text x="770" y="480" fill="#6ba6d6" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" letter-spacing="3" text-anchor="middle" transform="rotate(-85 770 480)">VICE BEACH</text>
  <text x="520" y="605" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" letter-spacing="2" text-anchor="middle">DOWNTOWN VICE</text>
  <text x="210" y="380" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="2" text-anchor="middle">PORT GELLHORN</text>
  <text x="390" y="240" fill="#38a169" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="2" text-anchor="middle">GRASSRIVERS SWAMPS</text>
  <text x="750" y="110" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="2" text-anchor="middle">THE VICE KEYS</text>
  <text x="200" y="840" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="2" text-anchor="middle">NORTH LEONIDA</text>

  <!-- ================= DETALHES CARTOGRÁFICOS ================= -->
  <!-- Rosa dos Ventos Tecnológica -->
  <g transform="translate(900, 850)">
    <circle cx="0" cy="0" r="32" fill="#0c1420" stroke="#1e2e42" stroke-width="1.5" />
    <path d="M 0,-26 L 6,-6 L 26,0 L 6,6 L 0,26 L -6,6 L -26,0 L -6,-6 Z" fill="#1a2b3d" stroke="#00ff66" stroke-width="1" />
    <path d="M 0,-26 L 0,0 L 6,-6 Z" fill="#00ff66" />
    <text x="0" y="-30" fill="#00ff66" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">N</text>
    <text x="36" y="4" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">E</text>
    <text x="0" y="40" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">S</text>
    <text x="-36" y="4" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">W</text>
  </g>

  <!-- Escala Cartográfica -->
  <g transform="translate(80, 950)">
    <rect x="0" y="-14" width="160" height="24" fill="#0a101a" stroke="#1d2c3e" rx="4" />
    <line x1="15" y1="0" x2="145" y2="0" stroke="#00ff66" stroke-width="2" />
    <line x1="15" y1="-5" x2="15" y2="5" stroke="#00ff66" stroke-width="2" />
    <line x1="80" y1="-3" x2="80" y2="3" stroke="#00ff66" stroke-width="1.5" />
    <line x1="145" y1="-5" x2="145" y2="5" stroke="#00ff66" stroke-width="2" />
    <text x="15" y="-7" fill="#64748b" font-family="monospace" font-size="7">0</text>
    <text x="80" y="-7" fill="#64748b" font-family="monospace" font-size="7" text-anchor="middle">5 KM</text>
    <text x="145" y="-7" fill="#64748b" font-family="monospace" font-size="7" text-anchor="end">10 KM</text>
  </g>

  <!-- Cabeçalho do Mapa / Marca d'água de Demonstração Oficial -->
  <g transform="translate(40, 50)">
    <text x="0" y="0" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="3">GTAVIMAP<tspan fill="#00ff66">.COM</tspan></text>
    <text x="0" y="16" fill="#94a3b8" font-family="monospace" font-size="8" letter-spacing="1.5">PROTÓTIPO CARTOGRÁFICO • ESTADO DE LEONIDA (BASE DE DEMONSTRAÇÃO)</text>
    <text x="0" y="28" fill="#f59e0b" font-family="monospace" font-size="7.5" font-weight="bold">⚠ DADOS NÃO OFICIAIS — PREPARADO PARA RECEBER TILES DO JOGO FINAL</text>
  </g>

  <!-- Grade de coordenadas nas bordas (Grid Ticks) -->
  <text x="100" y="990" fill="#334b68" font-family="monospace" font-size="8">E100</text>
  <text x="300" y="990" fill="#334b68" font-family="monospace" font-size="8">E300</text>
  <text x="500" y="990" fill="#334b68" font-family="monospace" font-size="8">E500</text>
  <text x="700" y="990" fill="#334b68" font-family="monospace" font-size="8">E700</text>
  <text x="900" y="990" fill="#334b68" font-family="monospace" font-size="8">E900</text>

  <text x="10" y="100" fill="#334b68" font-family="monospace" font-size="8">N100</text>
  <text x="10" y="300" fill="#334b68" font-family="monospace" font-size="8">N300</text>
  <text x="10" y="500" fill="#334b68" font-family="monospace" font-size="8">N500</text>
  <text x="10" y="700" fill="#334b68" font-family="monospace" font-size="8">N700</text>
  <text x="10" y="900" fill="#334b68" font-family="monospace" font-size="8">N900</text>
</svg>
